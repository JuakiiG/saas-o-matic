[project]
name = "saas-o-matic-backend"
version = "0.1.0"
description = "REST API of SaaS-O-Matic: customers, tiered pricing, taxes and simulations."
requires-python = "==3.12.*"
# Exact versions here; uv.lock pins the transitive ones with their hashes.
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
# Never imported from app/: tools, the test client (httpx2) and the reference
# implementation for the differential test of the tax id (python-stdnum, ADR-005).
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "python-stdnum==2.2",
    "ruff==0.17.4",
]

[tool.uv]
# One week of margin: a release younger than this date is not eligible yet (ADR-007).
# To update, move the date forward and lock again.
exclude-newer = "2026-11-06T00:00:00Z"
# An application run from this folder, not a library: there is nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `app` importable without installing the project.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
# A warning, such as a deprecation in a dependency, fails the test instead of scrolling by.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Whole backend: 90 % of branches. The oracle also demands 100 % in app/domain/.
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", # pycodestyle and pyflakes
    "I",           # import order
    "N",           # naming
    "UP",          # idioms of the target Python version
    "B",           # likely bugs
    "C4", "SIM",   # simpler comprehensions and control flow
    "ANN",         # every function is annotated
    "BLE",         # no blind `except`
    "S",           # security: SQL built from strings, `except: pass`
    "DTZ",         # no naive datetimes: timestamps are UTC
    "T20",         # no `print`
    "PT",          # pytest style
    "RUF",         # ruff's own rules, including unused suppressions
]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest states an expectation.
"tests/**" = ["S101"]
